<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lao - English AI Translator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js for reading .docx files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .textarea-container { position: relative; }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 0.5rem;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 py-4">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="ph-fill ph-translate text-3xl text-blue-600"></i>
                <h1 class="text-xl font-bold text-gray-900">Document Translator</h1>
            </div>
            <div class="text-sm text-gray-500 font-medium">Lao ⇄ English</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full flex flex-col space-y-6">
        
        <!-- Controls & File I/O Row -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200 gap-4">
            
            <!-- Language Swap -->
            <div class="flex items-center space-x-3 bg-gray-100 p-1.5 rounded-lg w-full md:w-auto justify-center">
                <span id="lang-source" class="font-semibold text-gray-700 px-4 py-1.5 bg-white rounded shadow-sm">Lao</span>
                <button id="btn-swap" class="p-2 text-gray-500 hover:text-blue-600 hover:bg-gray-200 rounded-full transition-colors" title="Swap Languages">
                    <i class="ph ph-arrows-left-right text-xl"></i>
                </button>
                <span id="lang-target" class="font-semibold text-gray-700 px-4 py-1.5 bg-transparent rounded">English</span>
            </div>

            <!-- File Actions -->
            <div class="flex items-center space-x-3 w-full md:w-auto justify-center">
                <label for="file-upload" class="cursor-pointer flex items-center space-x-2 bg-blue-50 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors border border-blue-200">
                    <i class="ph ph-upload-simple text-lg"></i>
                    <span class="font-medium">Import .docx / .txt</span>
                    <input id="file-upload" type="file" accept=".docx,.txt" class="hidden">
                </label>
                
                <button id="btn-export" class="flex items-center space-x-2 bg-green-50 text-green-700 px-4 py-2 rounded-lg hover:bg-green-100 transition-colors border border-green-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="ph ph-download-simple text-lg"></i>
                    <span class="font-medium">Export .doc</span>
                </button>
            </div>
        </div>

        <!-- Translation Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
            
            <!-- Source Text Area -->
            <div class="flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center">
                    <span class="font-medium text-gray-700">Source Text</span>
                    <button id="btn-clear" class="text-sm text-gray-500 hover:text-red-500 transition-colors">Clear</button>
                </div>
                <div class="p-4 flex-grow textarea-container">
                    <textarea id="text-source" class="w-full h-64 md:h-full min-h-[300px] resize-none focus:outline-none focus:ring-0 border-none p-0 text-gray-800 text-lg placeholder-gray-400 bg-transparent" placeholder="Type or import text here..."></textarea>
                </div>
            </div>

            <!-- Target Text Area -->
            <div class="flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
                <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center">
                    <span class="font-medium text-gray-700">Translation</span>
                    <button id="btn-copy" class="text-sm text-gray-500 hover:text-blue-600 transition-colors flex items-center space-x-1" disabled>
                        <i class="ph ph-copy"></i>
                        <span>Copy</span>
                    </button>
                </div>
                <div class="p-4 flex-grow textarea-container">
                    <textarea id="text-target" class="w-full h-64 md:h-full min-h-[300px] resize-none focus:outline-none focus:ring-0 border-none p-0 text-gray-800 text-lg placeholder-gray-400 bg-transparent" placeholder="Translation will appear here..." readonly></textarea>
                    
                    <!-- Loading Overlay -->
                    <div id="loading-overlay" class="loading-overlay hidden">
                        <div class="flex flex-col items-center space-y-3">
                            <div class="spinner"></div>
                            <span class="text-sm font-medium text-blue-600">Translating...</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Action Button -->
        <div class="flex justify-center">
            <button id="btn-translate" class="bg-blue-600 text-white hover:bg-blue-700 px-8 py-3 rounded-full font-bold text-lg shadow-md hover:shadow-lg transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-md disabled:hover:bg-blue-600">
                <i class="ph ph-translate"></i>
                <span>Translate to English</span>
            </button>
        </div>

        <!-- Error Message Container -->
        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative text-center" role="alert">
            <span class="block sm:inline" id="error-text">An error occurred.</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm">
        <p>&copy; 2026 AI Document Translator. Note: Requires standard .docx formats for import. .doc files are exported via HTML wrapper for Word compatibility.</p>
    </footer>

    <script>
        // -- Configuration & State --
        const apiKey = ""; // API Key provided by execution environment
        let isLaoToEnglish = true;
        
        // -- DOM Elements --
        const elLangSource = document.getElementById('lang-source');
        const elLangTarget = document.getElementById('lang-target');
        const btnSwap = document.getElementById('btn-swap');
        
        const elTextSource = document.getElementById('text-source');
        const elTextTarget = document.getElementById('text-target');
        
        const btnClear = document.getElementById('btn-clear');
        const btnCopy = document.getElementById('btn-copy');
        const btnTranslate = document.getElementById('btn-translate');
        
        const fileUpload = document.getElementById('file-upload');
        const btnExport = document.getElementById('btn-export');
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        // -- Event Listeners --
        
        // Swap Languages
        btnSwap.addEventListener('click', () => {
            isLaoToEnglish = !isLaoToEnglish;
            updateLanguageUI();
            
            // Swap texts if there's text
            const temp = elTextSource.value;
            elTextSource.value = elTextTarget.value;
            elTextTarget.value = temp;
            
            updateExportCopyButtons();
        });

        // Input change listener to enable/disable buttons
        elTextSource.addEventListener('input', () => {
            btnTranslate.disabled = elTextSource.value.trim().length === 0;
        });

        // Clear Source
        btnClear.addEventListener('click', () => {
            elTextSource.value = '';
            elTextTarget.value = '';
            btnTranslate.disabled = true;
            updateExportCopyButtons();
            hideError();
        });

        // Copy Target
        btnCopy.addEventListener('click', () => {
            if (elTextTarget.value) {
                // Use execCommand as fallback for iframe restrictions
                elTextTarget.select();
                document.execCommand('copy');
                
                const originalText = btnCopy.innerHTML;
                btnCopy.innerHTML = '<i class="ph ph-check"></i><span>Copied</span>';
                btnCopy.classList.add('text-green-600');
                
                setTimeout(() => {
                    btnCopy.innerHTML = originalText;
                    btnCopy.classList.remove('text-green-600');
                }, 2000);
            }
        });

        // File Import (.docx, .txt)
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            hideError();
            elTextSource.value = "Reading file...";

            if (file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    elTextSource.value = e.target.result;
                    btnTranslate.disabled = false;
                };
                reader.readAsText(file);
            } else if (file.name.endsWith('.docx')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mammoth.extractRawText({arrayBuffer: e.target.result})
                        .then(function(result){
                            elTextSource.value = result.value;
                            btnTranslate.disabled = elTextSource.value.trim().length === 0;
                            if (result.messages.length > 0) {
                                console.warn("Mammoth messages:", result.messages);
                            }
                        })
                        .catch(function(err){
                            showError("Error reading .docx file. Please ensure it's a valid Word document.");
                            elTextSource.value = "";
                        });
                };
                reader.readAsArrayBuffer(file);
            } else {
                showError("Unsupported file type. Please upload .docx or .txt");
                elTextSource.value = "";
            }
            
            // Reset input so the same file can be uploaded again if needed
            e.target.value = ''; 
        });

        // File Export (.doc)
        btnExport.addEventListener('click', () => {
            const text = elTextTarget.value;
            if (!text) return;

            // Create an HTML wrapper to ensure MS Word parses UTF-8 correctly
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Translated Document</title></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + text.replace(/\n/g, '<br>') + footer;

            // Create a blob with Word document MIME type
            const blob = new Blob(['\ufeff', sourceHTML], {
                type: 'application/msword'
            });

            // Create download link
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Translated_Document_${isLaoToEnglish ? 'EN' : 'LA'}.doc`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        // Translate Button Click
        btnTranslate.addEventListener('click', async () => {
            const text = elTextSource.value.trim();
            if (!text) return;

            setLoading(true);
            hideError();

            const sourceLanguage = isLaoToEnglish ? "Lao" : "English";
            const targetLanguage = isLaoToEnglish ? "English" : "Lao";
            
            const systemPrompt = `You are a professional, highly accurate translator. Translate the following text from ${sourceLanguage} to ${targetLanguage}. Maintain the original formatting, tone, and paragraph structure. Return ONLY the translated text, with no introductory or concluding remarks.`;

            try {
                const translatedText = await callGeminiAPIWithRetry(text, systemPrompt);
                elTextTarget.value = translatedText;
                updateExportCopyButtons();
            } catch (error) {
                console.error("Translation Error:", error);
                showError("Translation failed after multiple attempts. Please try again later.");
            } finally {
                setLoading(false);
            }
        });


        // -- Helper Functions --

        function updateLanguageUI() {
            if (isLaoToEnglish) {
                elLangSource.innerText = "Lao";
                elLangTarget.innerText = "English";
                
                elLangSource.classList.add('bg-white', 'shadow-sm');
                elLangSource.classList.remove('bg-transparent');
                elLangTarget.classList.remove('bg-white', 'shadow-sm');
                elLangTarget.classList.add('bg-transparent');
                
                btnTranslate.innerHTML = '<i class="ph ph-translate"></i><span>Translate to English</span>';
            } else {
                elLangSource.innerText = "English";
                elLangTarget.innerText = "Lao";

                elLangSource.classList.remove('bg-white', 'shadow-sm');
                elLangSource.classList.add('bg-transparent');
                elLangTarget.classList.add('bg-white', 'shadow-sm');
                elLangTarget.classList.remove('bg-transparent');

                btnTranslate.innerHTML = '<i class="ph ph-translate"></i><span>Translate to Lao</span>';
            }
        }

        function updateExportCopyButtons() {
            const hasTargetText = elTextTarget.value.trim().length > 0;
            btnExport.disabled = !hasTargetText;
            btnCopy.disabled = !hasTargetText;
        }

        function setLoading(isLoading) {
            btnTranslate.disabled = isLoading;
            if (isLoading) {
                loadingOverlay.classList.remove('hidden');
                elTextTarget.value = "";
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorText.innerText = msg;
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // -- API Logic --

        async function callGeminiAPIWithRetry(text, systemPrompt) {
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000]; // Exponential backoff

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: text }]
                            }],
                            systemInstruction: {
                                parts: [{ text: systemPrompt }]
                            }
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // Extract text safely
                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                         return data.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Unexpected API response structure.");
                    }

                } catch (error) {
                    if (i === maxRetries) {
                        throw error; // All retries exhausted
                    }
                    // Wait before retrying (hidden from console as requested)
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

    </script>
</body>
</html>
